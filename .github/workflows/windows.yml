name: Windows build and core tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
      - name: Verify dependencies
        run: go mod verify
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Verify generated original icon
        run: go run ./scripts/generate-icon -check
      - name: Build native Windows executable
        env:
          CGO_ENABLED: '0'
          GOARCH: amd64
        run: go build -trimpath -tags mygo_noinspector -ldflags '-H windowsgui -s -w' -o dist/MyCast.exe ./cmd/mycast
      - name: Verify embedded PE icon sizes and content
        run: go run ./scripts/verify-icon -exe dist/MyCast.exe
      - name: Check MyGo native window icon ABI
        run: go run -tags mygo_noinspector ./scripts/verify-window-icon
      - name: Package source notices and executable
        id: package
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -LayoutOnly
      - uses: actions/upload-artifact@v4
        with:
          name: MyCast-windows-amd64
          path: ${{ steps.package.outputs.package_path }}
          if-no-files-found: error
          retention-days: 14
